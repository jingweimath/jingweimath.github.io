<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历年真题 · 经维考研数学</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1a56db;
    --primary-dark: #1e429f;
    --primary-light: #e8f0fe;
    --accent: #e24b4a;
    --text: #1e1e2e;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f8f9fc;
    --white: #ffffff;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--white); }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 15px; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--primary); }
  .nav-cta { background: var(--primary); color: white; padding: 8px 20px; border-radius: 8px; font-size: 14px; text-decoration: none; font-weight: 500; transition: background 0.2s; }
  .nav-cta:hover { background: var(--primary-dark); }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 32px; justify-content: center; }
  .tab-btn {
    padding: 10px 28px; border-radius: 10px; font-size: 15px; font-weight: 600;
    border: 1.5px solid var(--border); background: white; cursor: pointer;
    transition: all 0.2s; color: var(--text-muted);
  }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .tab-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

  /* YEAR GRID */
  .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .year-card {
    background: white; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; transition: all 0.2s;
  }
  .year-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .year-title { font-size: 20px; font-weight: 800; margin-bottom: 14px; color: var(--primary); }
  .year-links { display: flex; flex-direction: column; gap: 10px; }
  .year-link {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 8px;
    text-decoration: none; color: var(--text);
    border: 1px solid var(--border);
    font-size: 14px; font-weight: 500;
    transition: all 0.2s;
  }
  .year-link:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .year-link .icon { font-size: 18px; }
  .year-link .label { flex: 1; }
  .year-link .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .badge-exam { background: #dbeafe; color: #1d4ed8; }
  .badge-sol { background: #dcfce7; color: #15803d; }

  /* SECTION */
  section { padding: 72px 5%; }
  .section-header { text-align: center; margin-bottom: 48px; }
  .section-tag { font-size: 13px; font-weight: 600; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .section-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
  .section-sub { font-size: 16px; color: var(--text-muted); max-width: 500px; margin: 0 auto; line-height: 1.7; }

  /* TAB PANELS */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* NOTICE */
  .notice {
    background: var(--primary-light); border-radius: var(--radius);
    padding: 16px 24px; margin-bottom: 32px;
    display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: var(--primary);
    line-height: 1.7;
  }
  .notice .icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }

  @media (max-width: 768px) {
    .year-grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
    nav .nav-links { display: none; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">经维<span>数学</span></div>
  <ul class="nav-links">
    <li><a href="index.html">首页</a></li>
    <li><a href="courses.html">网课视频</a></li>
    <li><a href="plan.html">复习计划</a></li>
    <li><a href="practice.html">题库练习</a></li>
    <li><a href="exams.html" class="active">历年真题</a></li>
  </ul>
  <a href="#pricing" class="nav-cta">立即报名</a>
</nav>

<section>
  <div class="section-header">
    <div class="section-tag">历年真题</div>
    <div class="section-title">考研数学真题与详解</div>
    <div class="section-sub">2010-2025 年数学一、数学二真题及详细解答，免费下载</div>
  </div>

  <div class="notice">
    <span class="icon">💡</span>
    <span>建议先独立做题，再对照详解。重点关注错题的解题思路，而非仅仅记住答案。</span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('math1')">数学一</button>
    <button class="tab-btn" onclick="switchTab('math2')">数学二</button>
  </div>

  <!-- 数学一 -->
  <div id="panel-math1" class="tab-panel active">
    <div class="year-grid" id="grid-math1">
      <!-- JS 生成 -->
    </div>
  </div>

  <!-- 数学二 -->
  <div id="panel-math2" class="tab-panel">
    <div class="year-grid" id="grid-math2">
      <!-- JS 生成 -->
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="background:#111827;color:#9ca3af;padding:48px 5% 32px;text-align:center;font-size:13px;">
  <div style="margin-bottom:16px">
    <span style="color:#60a5fa;font-size:18px;font-weight:700;">经维<span style="color:#f87171">数学</span></span>
  </div>
  <div style="margin-bottom:12px;">
    <a href="index.html" style="color:#9ca3af;text-decoration:none;margin:0 12px;">首页</a>
    <a href="courses.html" style="color:#9ca3af;text-decoration:none;margin:0 12px;">网课</a>
    <a href="exams.html" style="color:#9ca3af;text-decoration:none;margin:0 12px;">真题</a>
    <a href="practice.html" style="color:#9ca3af;text-decoration:none;margin:0 12px;">题库</a>
  </div>
  <div>© 2026 经维数学 · 考研辅导</div>
</footer>

<script>
const YEARS = [2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010];

function buildGrid(containerId, prefix) {
  const grid = document.getElementById(containerId);
  YEARS.forEach(y => {
    const card = document.createElement('div');
    card.className = 'year-card';
    card.innerHTML = `
      <div class="year-title">${y} 年</div>
      <div class="year-links">
        <a class="year-link" href="exams/${prefix}_${y}.pdf" target="_blank">
          <span class="icon">📄</span>
          <span class="label">${y} 年真题</span>
          <span class="badge badge-exam">真题</span>
        </a>
        <a class="year-link" href="exams/${prefix}_${y}_solution.pdf" target="_blank">
          <span class="icon">📖</span>
          <span class="label">${y} 年详解</span>
          <span class="badge badge-sol">详解</span>
        </a>
      </div>
    `;
    grid.appendChild(card);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

buildGrid('grid-math1', 'math1');
buildGrid('grid-math2', 'math2');
</script>

</body>
</html>
